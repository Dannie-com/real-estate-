<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Properties.ng</title>
  <link rel="stylesheet" href="login.css " />

</head>

<body>
  <div class="container">
    <div class="flex" style="display: flex;">
      <div class="login-box">
        <div class="logo">Properties.ng</div>
        <h2>Welcome Back!</h2>
        <p>Welcome back; kindly enter your details.</p>
        <form>
          <input type="email" placeholder="Email Address" required />
          <input type="password" placeholder="Password" required />
          <div class="options">
            <label><input type="checkbox" />Remember me</label>
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit">Sign in</button>
          <div class="social-login">
            <button type="button">
              <img src="./images/google logo.jpeg" alt="Google logo"
                style="height:20px; vertical-align:middle; margin-right:8px;" />
              Sign in with Google
            </button>
            <button type="button">
              <img src="./images/apple logo.png" alt="Apple logo"
                style="height:20px; vertical-align:middle; margin-right:8px;" />
              Sign in with Apple
            </button>
          </div>
          <div class="signup">
            Don't have an account? <a href="#">Sign up</a>
          </div>
        </form>
      </div>
      <div class="right"><img src="./images/loginn.avif"/></div>
    </div>
</body>

</html>
